<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="MatrixNotes — fast offline workout logger" />
    <meta name="application-name" content="MatrixNotes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MatrixNotes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>MatrixNotes</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
        color: #e8e8e8;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        z-index: 9999;
        transition: opacity 0.25s ease;
      }
      #boot[hidden] {
        display: none;
      }
      .boot-mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        border: 1px solid rgba(57, 255, 136, 0.35);
        background: linear-gradient(145deg, #121412, #0d0f0d);
        box-shadow: 0 0 24px rgba(57, 255, 136, 0.12);
        display: grid;
        place-items: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 700;
        font-size: 18px;
        color: #39ff88;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-live="polite" aria-busy="true">
      <div class="boot-mark" aria-label="Loading MatrixNotes">MN</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
